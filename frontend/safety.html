<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жалобы и блокировки — Disbit</title><link rel="stylesheet" href="account-tools.css"></head><body><main><a href="index.html#friends">← Друзья</a><h1>Жалобы и блокировки</h1><p>Блокировка удаляет дружбу и запрещает повторное добавление и принятие совместных приглашений. Жалобы рассматриваем в течение 48 часов.</p><form id="safety-form"><label for="target">Логин пользователя</label><input id="target" required maxlength="100" autocomplete="off"><label for="reason">Причина жалобы</label><textarea id="reason" maxlength="1000" rows="4"></textarea><button type="submit" value="report">Отправить жалобу</button><button type="submit" value="block">Заблокировать пользователя</button></form><p id="result" role="status" aria-live="polite"></p><h2>Заблокированные</h2><ul id="blocks"></ul><p><a href="support.html">Написать в поддержку</a></p></main><script src="safety.js"></script></body></html>
